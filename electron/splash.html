<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />

  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;"
  />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>RIE Intelligence</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;

      background: #003c28;
      color: #ffffff;

      font-family:
        "Segoe UI",
        "Helvetica Neue",
        Arial,
        sans-serif;

      text-align: center;
      user-select: none;
      overflow: hidden;

      -webkit-font-smoothing: antialiased;
    }

    .content {
      display: flex;
      flex-direction: column;
      align-items: center;

      animation: appear 600ms ease-out;
    }

    /* BNP logo */
    .logo-container {
      width: 150px;
      height: 62px;

      display: flex;
      align-items: center;
      justify-content: center;

      margin-bottom: 28px;

      padding: 10px 18px;

      background: #ffffff;

      border-radius: 10px;

      box-shadow:
        0 8px 24px rgba(0, 0, 0, 0.12);
    }

    .logo-container img {
      display: block;

      width: 112px;
      height: auto;

      object-fit: contain;
    }

    /* Application name */
    .brand {
      font-size: 30px;
      line-height: 1.15;

      font-weight: 600;
      letter-spacing: -0.6px;

      color: #ffffff;

      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 14px;
      line-height: 1.4;

      font-weight: 400;

      color: rgba(255, 255, 255, 0.68);
    }

    /* Small separator */
    .separator {
      width: 32px;
      height: 1px;

      margin-top: 27px;

      background: rgba(255, 255, 255, 0.25);
    }

    /* Loading indicator */
    .loader {
      width: 26px;
      height: 26px;

      margin-top: 24px;
      margin-bottom: 14px;

      border: 2px solid rgba(255, 255, 255, 0.16);
      border-top-color: #ffffff;

      border-radius: 50%;

      animation: spin 800ms linear infinite;
    }

    .status {
      font-size: 12px;

      color: rgba(255, 255, 255, 0.52);
    }

    /* Footer */
    .footer {
      position: fixed;

      left: 0;
      right: 0;
      bottom: 17px;

      text-align: center;

      font-size: 10px;

      color: rgba(255, 255, 255, 0.28);

      letter-spacing: 0.35px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .content,
      .loader {
        animation: none;
      }
    }
  </style>
</head>

<body>

  <main class="content">

    <div class="logo-container">
      <img
        src="./assets/bnp-paribas-logo.svg"
        alt="BNP Paribas"
      />
    </div>

    <h1 class="brand">
      RIE Intelligence
    </h1>

    <p class="subtitle">
      Organisation &amp; prévision
    </p>

    <div class="separator"></div>

    <div
      class="loader"
      aria-hidden="true"
    ></div>

    <p class="status">
      Démarrage du système...
    </p>

  </main>

  <footer class="footer">
    BNP Paribas El Djazaïr
  </footer>

</body>
</html>
